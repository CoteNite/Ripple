name: Windows Release

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Validate and build Windows release
    runs-on: windows-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
      artifact-name: ${{ steps.package.outputs.artifact-name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Set package metadata and validate tag
        id: package
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $expectedTag = "v$version"
            if ($env:GITHUB_REF_NAME -ne $expectedTag) {
              throw "Release tag '$env:GITHUB_REF_NAME' does not match package version '$expectedTag'."
            }
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "artifact-name=ripple-windows-release-$env:GITHUB_SHA" >> $env:GITHUB_OUTPUT

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run backend unittest suite
        working-directory: backend
        run: python -m unittest discover -s tests

      - name: Run Electron tests
        run: node --test electron/tests/leveldb-wal.test.js electron/tests/session-migration.test.js

      - name: Build frontend
        run: npm run build:frontend

      - name: Build backend
        run: npm run build:backend

      - name: Build unsigned Windows installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Generate release checksums
        shell: pwsh
        run: |
          $version = '${{ steps.package.outputs.version }}'
          $installer = "release/Ripple Setup $version.exe"
          $blockmap = "$installer.blockmap"
          foreach ($file in @($installer, $blockmap)) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Expected release asset was not produced: $file"
            }
          }
          $lines = foreach ($file in @($installer, $blockmap)) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLowerInvariant()
            "$hash  $([System.IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content -LiteralPath 'release/SHA256SUMS.txt' -Encoding ascii

      - name: Upload Windows release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.package.outputs.artifact-name }}
          path: |
            release/Ripple Setup ${{ steps.package.outputs.version }}.exe
            release/Ripple Setup ${{ steps.package.outputs.version }}.exe.blockmap
            release/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    name: Publish tagged GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: release

      - name: Write release notes
        run: |
          cat > release-notes.md <<'EOF'
          ## Windows installer

          - Includes the Windows data lifecycle and corruption-safety protections.
          - The installer is currently unsigned; Windows SmartScreen may display a warning.
          EOF

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --verify-tag \
            --title "Ripple v$VERSION" \
            --notes-file release-notes.md \
            "release/Ripple Setup $VERSION.exe" \
            "release/Ripple Setup $VERSION.exe.blockmap" \
            release/SHA256SUMS.txt
